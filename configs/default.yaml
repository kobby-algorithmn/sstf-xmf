# SSTF-XMF Default Configuration
# ================================
# Configuration for the Self-Supervised Temporal Transformer with
# Explainable Multi-Modal Fusion framework.

model:
  hidden_dim: 256
  num_heads: 8
  intra_visit_layers: 2
  inter_visit_layers: 6
  ff_dim: 1024
  dropout: 0.1
  max_visits: 512
  max_events_per_visit: 64
  max_medications_per_visit: 20
  max_text_tokens: 512
  num_lab_features: 128
  num_vital_features: 32
  num_diagnosis_codes: 1800
  num_procedure_codes: 500
  num_medication_codes: 600
  imaging_feature_dim: 24
  text_model_name: "emilyalsentzer/Bio_ClinicalBERT"
  text_embed_dim: 768
  text_trainable_layers: 2
  time_num_frequencies: 64
  time_max_hours: 87600.0
  num_concepts: 15
  num_modalities: 4
  prediction_horizon_years: 5.0
  num_time_bins: 20

pretrain:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 10000
  gradient_clip: 1.0
  mcem_enabled: true
  mask_ratio: 0.15
  tcl_enabled: true
  tcl_temperature: 0.07
  tcl_weight: 0.5
  tcl_window_hours: 720.0
  save_every_n_epochs: 5
  early_stopping_patience: 10

finetune:
  epochs: 50
  batch_size: 128
  learning_rate: 0.00005
  weight_decay: 0.01
  gradient_clip: 1.0
  survival_loss_weight: 1.0
  calibration_loss_weight: 0.1
  concept_consistency_weight: 0.05
  fairness_lambda: 0.1
  early_stopping_metric: "val_auroc"
  early_stopping_patience: 8

data:
  mimic_iv_path: "./data/mimic-iv"
  eicu_path: "./data/eicu"
  ukbiobank_path: "./data/ukbiobank"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  min_age: 40
  min_encounters: 2
  min_followup_days: 365
  min_events_per_patient: 10
  outlier_clip_quantile: 0.001
  missing_indicator: true
  feature_scaler: "robust"
  num_workers: 4
  pin_memory: true
  persistent_workers: true

deployment:
  fhir_base_url: "https://fhir.example.nhs.uk/R4"
  onnx_export_path: "./artefacts/sstf_xmf.onnx"
  inference_quantisation: "int8"
  inference_batch_size: 32
  max_latency_ms: 2000
  psi_threshold: 0.2
  ks_threshold: 0.1
  fairness_auroc_threshold: 0.05
  monitoring_interval_hours: 24
  audit_log_path: "./logs/audit.log"
  model_version: "1.0.0"
  uk_mhra_classification: "Class IIa SaMD"
  eu_ai_act_classification: "High-risk AI system"

seed: 42
device: "cuda"
mixed_precision: true
log_level: "INFO"
experiment_name: "sstf_xmf_v1"
output_dir: "./outputs"
